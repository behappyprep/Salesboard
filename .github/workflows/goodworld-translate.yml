name: GoodWorld multilingual news translations
on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goodworld-translate.yml'
permissions:
  contents: write
concurrency:
  group: goodworld-hourly-translations
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        language: [zh, hi, es, ar, fr, bn, pt, id, ur, ru]
    steps:
      - name: Check out GoodWorld website branch
        uses: actions/checkout@v4
        with:
          ref: goodworld-preview
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: goodworld-preview/translation-requirements.txt
      - name: Cache offline language model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate/packages
          key: goodworld-argos-model-${{ matrix.language }}-v1
      - name: Install Argos Translate
        run: python -m pip install -r goodworld-preview/translation-requirements.txt
      - name: Translate verified public news
        run: python goodworld-preview/translate_news.py ${{ matrix.language }}
      - name: Upload translated news
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ matrix.language }}
          path: goodworld-preview/translations/${{ matrix.language }}.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: translate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out GoodWorld website branch
        uses: actions/checkout@v4
        with:
          ref: goodworld-preview
          persist-credentials: true
          fetch-depth: 1
      - name: Download available language updates
        uses: actions/download-artifact@v4
        with:
          pattern: news-*
          path: goodworld-preview/translations
          merge-multiple: true
      - name: Commit completed translations
        run: |
          if [ -z "$(ls -A goodworld-preview/translations 2>/dev/null)" ]; then
            echo "No completed language files to publish"
            exit 0
          fi
          git config user.name "goodworld-translation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add goodworld-preview/translations/
          if git diff --cached --quiet; then
            echo "Translations already current"
          else
            git commit -m "GoodWorld: update automated multilingual news translations"
            git push origin HEAD:goodworld-preview
          fi
