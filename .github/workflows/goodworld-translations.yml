name: GoodWorld multilingual news translations

on:
  schedule:
    # Non-zero minute avoids GitHub Actions congestion at the top of the hour.
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goodworld-multilingual-translation
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out GoodWorld production branch
        uses: actions/checkout@v4
        with:
          ref: goodworld-preview
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: goodworld-preview/translation-requirements.txt
      - name: Cache offline translation models
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
          key: goodworld-argos-models-v1
      - name: Install pinned translation dependencies
        run: python -m pip install -r goodworld-preview/translation-requirements.txt
      - name: Translate published source-verified stories
        id: translate
        continue-on-error: true
        run: python goodworld-preview/translate_news.py
      - name: Commit updated translations to production branch
        run: |
          git config user.name "goodworld-translation-bot"
          git config user.email "goodworld-translations@users.noreply.github.com"
          git add goodworld-preview/translations/*.json
          if git diff --cached --quiet; then
            echo "No new translations"
          else
            git commit -m "GoodWorld: refresh multilingual news translations"
            git push origin HEAD:goodworld-preview
          fi
      - name: Report translation errors
        if: steps.translate.outcome == 'failure'
        run: |
          echo "At least one language failed; successful translations were saved for the next retry."
          exit 1
