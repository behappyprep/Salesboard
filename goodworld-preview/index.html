<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#10221b"/>
<meta name="description" content="GoodWorld — a better way to see the world. Scroll positive news, voted up by people."/>
<title>GoodWorld — Scroll the good.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect rx='22' width='100' height='100' fill='%2310221b'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-size='61'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E"/>
<link rel="stylesheet" href="./style.css"/></head>
<body><main class="app">
<header class="header"><button class="wordmark" id="home" aria-label="GoodWorld Home"><span class="star">✳</span> good<span class="mark">world</span></button><button class="trial" id="join">Try 7 days free <span>↗</span></button></header>
<div class="switcher" id="switcher"><button class="tab selected" data-tab="top">♥ Top Today</button><button class="tab" data-tab="new">✦ New</button></div>
<section class="feed" id="feed" aria-label="Good news feed"></section>

<nav class="nav" aria-label="Main navigation"><button class="navitem active" data-page="feed"><span class="navicon">▤</span>Feed</button><button class="navitem" data-page="submit"><span class="navicon">⊕</span>Submit</button><button class="navitem" data-page="rewards"><span class="navicon">◇</span>Rewards</button><button class="navitem" data-page="profile"><span class="navicon">◯</span>Profile</button></nav>
<div class="modalback hidden" id="modal"></div><div class="toast" id="toast" role="status"></div>
<div class="demo">DESIGN PREVIEW · SIMULATED STORIES & LIKES</div>
</main><script src="./app.js" defer></script></body></html>
