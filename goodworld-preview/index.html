<body><main class="app">
<header class="header">
  <button class="wordmark" id="home" aria-label="GoodWorld, return to feed"><span class="brandmark">✳</span> good<span class="mark">world</span></button>

    <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>
<div class="switcher" id="switcher"><button class="tab selected" data-tab="top">Top Today</button><button class="tab" data-tab="new">New</button></div>
<section class="feed" id="feed" aria-label="Good news feed"></section>
<div class="overlaypage hidden" id="page" aria-live="polite"></div>
<div class="menu-overlay hidden" id="menuOverlay">
  <button class="menu-scrim" id="menuScrim" aria-label="Close menu"></button>

    <div class="menu-head"><span class="menu-heading">Menu</span><button class="menu-close" id="menuClose" aria-label="Close menu">×</button></div>
    <nav class="menu-nav" aria-label="GoodWorld sections">
      <button class="navitem active" data-page="feed"><span>Feed</span><span class="nav-arrow">↗</span></button>
      <button class="navitem" data-page="donate"><span>Donate <small>Support free positive news</small></span><span class="nav-arrow">↗</span></button>
      <button class="navitem" data-page="profile"><span>Profile <small>Your account and likes</small></span><span class="nav-arrow">↗</span></button>
      <button class="editor-menu-item hidden" id="editorNav" type="button"><span>Editorial <small>Review and publish news</small></span><span class="nav-arrow">↗</span></button>
    </nav>
    <div class="menu-support">
      <div class="menu-support-eyebrow">FREE FOR EVERYONE</div>
      <h2>Keep good news free.</h2>
      <p>GoodWorld is free to explore. If you love what we're building, help us keep the good going.</p>
      <button class="donate-cta" id="join">♡ Donate <span>↗</span></button>
    </div>
    <p class="menu-small">Real good news, freely shared.</p>
  </aside>
</div>
