# ChannelPilot private pilot. The existing free Postgres instance expires 2026-10-18.
# Upgrade database and arrange backups before using this with real customers.
services:
  - type: web
    name: channelpilot-web
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: channelpilot-db
          property: connectionString
      - key: APP_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ENABLE_SCHEDULER
        value: "false"
      # Add approved provider OAuth credentials via Render secret environment variables.
# channelpilot-db already exists in the same Render workspace and is referenced above.
